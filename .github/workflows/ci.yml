name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint mobile
        run: npm run lint --workspace apps/mobile

      - name: Lint admin
        run: npm run lint --workspace apps/admin

      - name: Typecheck mobile
        run: npx tsc --noEmit -p apps/mobile

      - name: Build admin
        run: npm run build --workspace apps/admin
